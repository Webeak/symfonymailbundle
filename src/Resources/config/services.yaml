services:
    _defaults:
        autowire: true
        autoconfigure: true

    #
    # Transports
    #
    Webeak\Bundle\MailBundle\Transport\TipimailTransportFactory:
        tags: ['mailer.transport_factory']

#    Webeak\Bundle\MailBundle\Transport\TrackedTransportDecorator:
#        public: false
#        decorates: 'mailer.transport'
#        arguments:
#            - '@logger'
#            - '@.inner'
#            - '@doctrine.orm.entity_manager'

    Webeak\Bundle\MailBundle\Transport\TrackedTransportFactoryDecorator:
        autoconfigure: false
        decorates: 'Webeak\Bundle\MailBundle\Transport\TipimailTransportFactory'
        arguments:
            - '@.inner'
            - '@logger'
            - '@doctrine.orm.wb_entity_manager'

    #
    # Event subscribers
    #
    Webeak\Bundle\MailBundle\EventSubscriber\:
        resource: '../../EventSubscriber'
        tags: [ { name: kernel.event_subscriber } ]
